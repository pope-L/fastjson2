name: Fastjson2 CI (JDK 8 & 17)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        java: [ 8, 17 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build Fastjson2 (root)
        run: |
          cd fastjson2
          ../mvnw -V --no-transfer-progress -DskipTests clean package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastjson2-jdk-${{ matrix.java }}
          path: fastjson2/fastjson2/target/*.jar
