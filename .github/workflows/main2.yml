name: Fastjson2 CI (JDK 8 & 17)main2.1

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: [ 8, 17 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build Fastjson2
        run: ./mvnw -V --no-transfer-progress -DskipTests clean package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastjson2-jdk-${{ matrix.java }}
          path: fastjson2/core/target/*.jar
